media:
  - name: uploads
    input: apps/wed/public/uploads
    output: /uploads

content:
  - name: products
    label: Productos
    type: file
    path: apps/wed/src/data/products.json
    format: json
    fields:
      - name: products
        label: Productos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: name
            label: Nombre
            type: string
            required: true
          - name: detail
            label: Detalle
            type: text
          - name: price
            label: Precio (COP)
            type: number
            required: true
          - name: sizes
            label: Tallas
            type: string
            list: true
          - name: images
            label: Galería de imágenes (máximo 10)
            type: image
            options:
              media: uploads
              multiple:
                max: 10
              unique: true
