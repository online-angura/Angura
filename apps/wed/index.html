<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%angura-brand.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Angura</title>
		<script>
			const redirect = new URLSearchParams(window.location.search).get('redirect');
			if (redirect) {
				const rawRoute = decodeURIComponent(redirect);
				const repoBase = '/Angura';
				const cleaned = rawRoute.startsWith(repoBase)
					? rawRoute.slice(repoBase.length) || '/'
					: rawRoute;
				const normalized = cleaned.startsWith('/') ? cleaned : `/${cleaned}`;
				window.history.replaceState(null, '', `${window.location.pathname}#${normalized}`);
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
