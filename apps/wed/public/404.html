<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      const target = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      const pathWithoutSlash = target === '/' ? '/' : target.replace(/^\/+/, '');
      window.location.replace(`/?redirect=${encodeURIComponent(pathWithoutSlash)}`);
    </script>
  </head>
  <body></body>
</html>
