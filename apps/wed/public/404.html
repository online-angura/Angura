<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      const pathname = window.location.pathname || '/';
      const basePath = pathname.includes('/Angura') ? '/Angura' : '';
      const relativePath = pathname.startsWith(basePath)
        ? pathname.slice(basePath.length) || '/'
        : pathname;
      const redirectTarget = relativePath === '/' ? '/' : relativePath;
      const targetUrl = `${basePath || '/'}?redirect=${encodeURIComponent(redirectTarget)}`;
      window.location.replace(targetUrl);
    </script>
  </head>
  <body></body>
</html>
