<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname || '/';
      const target = `${path}${window.location.search}${window.location.hash}`;
      window.location.replace(`/?redirect=${encodeURIComponent(target)}`);
    </script>
  </head>
  <body></body>
</html>
